spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coco_db}
    username: ${DB_USERNAME:coco}
    password: ${DB_PASSWORD:coco1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  storage:
    # 사용자 업로드는 컨테이너 로컬 디스크가 아니라 Supabase Storage에 영구 저장한다.
    # STORAGE_KEY는 백엔드 전용 sb_secret 키이며 프론트에 절대 노출하면 안 된다.
    # 기존 배포의 SUPABASE_SERVICE_ROLE_KEY도 하위 호환으로 읽는다.
    supabase-url: ${SUPABASE_URL:}
    key: ${SUPABASE_STORAGE_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
    bucket: ${SUPABASE_STORAGE_BUCKET:coco-uploads}
  # true면 스팟 등록 신청 시 관리자 승인 없이 바로 spots 테이블에 반영한다(콘테스트 데모용).
  # 나중에 실제 승인 플로우를 만들면 false로 바꾸거나 이 분기 자체를 지우면 된다.
  demo-mode: ${DEMO_MODE:true}

jwt:
  secret: ${JWT_SECRET:coco-secret-key-for-development-only}
  expiration: 86400000   # 24시간 (ms)

tour-api:
  base-url: https://apis.data.go.kr/B551011
  key: ${TOUR_API_KEY:}
  # TourAPI 버전이 바뀌어도 여기 값만 바꾸면 되도록 분리해둠 (현재 활성 버전 미확인 상태라 기본값은 추정치)
  kor-service-path: ${TOUR_API_KOR_SERVICE_PATH:KorService2}

kakao:
  # 지도(JavaScript) 키와는 다른, 카카오 디벨로퍼스 [앱 키] 탭의 REST API 키.
  rest-api-key: ${KAKAO_REST_API_KEY:}

openai:
  # 스팟/피드 다국어 처리(TranslationService)에 쓰는 OpenAI API 키.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
