spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coco_db}
    username: ${DB_USERNAME:coco}
    password: ${DB_PASSWORD:coco1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

# 피드 게시물 사진 등 업로드 파일이 저장될 로컬 디스크 경로.
# (working directory 기준 상대경로 — 배포 시 절대경로로 바꾸고 싶으면 UPLOAD_DIR로 오버라이드)
app:
  upload-dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:coco-secret-key-for-development-only}
  expiration: 86400000   # 24시간 (ms)

tour-api:
  base-url: https://apis.data.go.kr/B551011
  key: ${TOUR_API_KEY:}
  # TourAPI 버전이 바뀌어도 여기 값만 바꾸면 되도록 분리해둠 (현재 활성 버전 미확인 상태라 기본값은 추정치)
  kor-service-path: ${TOUR_API_KOR_SERVICE_PATH:KorService2}
  tar-rlte-tar-path: ${TOUR_API_TAR_RLTE_TAR_PATH:TarRlteTarService1}

kakao:
  # 지도(JavaScript) 키와는 다른, 카카오 디벨로퍼스 [앱 키] 탭의 REST API 키.
  rest-api-key: ${KAKAO_REST_API_KEY:}
