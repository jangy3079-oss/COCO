<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- viewport 메타가 없으면 지도 위에서 두 손가락으로 줌(핀치)할 때 카카오맵 자체의 줌이
       아니라 브라우저의 네이티브 페이지 줌으로 인식돼서, 줌이 끝난 뒤 주소창이 접히거나
       페이지가 재배치되며 화면 전체가 아래로 밀려 보이는 문제가 있었다 — maximum-scale과
       user-scalable=no로 페이지 자체의 핀치줌을 막아서 지도 확대만 반응하게 한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="coco_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>coco_frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // COCO 카카오맵 JS interop 브릿지. Dart(kakao_map_view_web.dart)에서 직접 호출한다.
    window.__cocoKakaoMaps = {}; // divId -> kakao.maps.Map 인스턴스
    window.__cocoKakaoMarkers = {}; // divId -> kakao.maps.CustomOverlay[] 배열 (핀 또는 클러스터 버블)
    window.__cocoKakaoOverlays = {}; // divId -> kakao.maps.CustomOverlay[] 배열 (마커 위 이름 태그)
    window.__cocoKakaoMarkersRaw = {}; // divId -> 마지막으로 받은 원본 마커 데이터(재클러스터링용)
    window.__cocoKakaoPolyline = {}; // divId -> 코스 순서 핀을 잇는 kakao.maps.Polyline (없으면 null)
    window.__cocoClusteringDisabled = {}; // divId -> true면 핀이 겹쳐도 뭉치지 않고 각자 그대로 그린다
    window.__cocoMarkerClickHandlers = {}; // divId -> onMarkerClick 콜백
    window.__cocoBoundsChangedHandlers = {}; // divId -> onBoundsChanged 콜백 (뷰포트 쿼리용)
    window.__cocoKakaoLoadPromise = null;
    window.__cocoKakaoCallout = {}; // divId -> 현재 열려있는 핀 정보 말풍선(CustomOverlay), 없으면 null
    window.__cocoBoundsDebounceTimers = {}; // divId -> bounds_changed 디바운스 setTimeout id

    // 말풍선이 "뿅" 튀어나오는 느낌으로 뜨도록 하는 바운스 팝업 애니메이션.
    // CustomOverlay는 매번 새 DOM을 만들어 붙이므로 클래스만 한 번 정의해두면 계속 재사용된다.
    (function cocoInjectStyles() {
      var style = document.createElement('style');
      style.textContent =
        '@keyframes cocoPopIn {' +
        '0% { transform: scale(0.7); opacity: 0; }' +
        '60% { transform: scale(1.03); opacity: 1; }' +
        '82% { transform: scale(0.99); }' +
        '100% { transform: scale(1); opacity: 1; }' +
        '}' +
        '.coco-pop-in { transform-origin: 50% 100%; animation: cocoPopIn 0.28s cubic-bezier(0.34, 1.2, 0.64, 1) both; }';
      document.head.appendChild(style);
    })();

    // 핀을 탭하면 바로 상세로 이동하지 않고 이 말풍선을 먼저 띄운다 — 이름/카테고리를
    // 보여주고, "자세히 보기"를 한 번 더 눌러야 실제 onMarkerClick(상세 이동)이 호출된다.
    function cocoHideCallout(divId) {
      var existing = window.__cocoKakaoCallout[divId];
      if (existing) {
        existing.setMap(null);
        window.__cocoKakaoCallout[divId] = null;
      }
    }

    function cocoShowCallout(divId, map, m, onMarkerClick) {
      cocoHideCallout(divId);

      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;transform:translateY(-14px);';

      // 실제로 애니메이션이 붙는 건 이 안쪽 pop — wrap 자체의 translateY 위치 보정과
      // 애니메이션용 scale transform이 서로 안 겹치게 분리했다(같은 엘리먼트에 두면
      // 애니메이션이 끝나는 순간 위치 보정 transform이 사라져버림).
      var pop = document.createElement('div');
      pop.className = 'coco-pop-in';
      pop.style.cssText = 'position:relative;';
      wrap.appendChild(pop);

      var card = document.createElement('div');
      card.style.cssText =
        'background:#fff;border-radius:12px;padding:10px 14px;min-width:130px;max-width:220px;' +
        'box-shadow:0 4px 14px rgba(0,0,0,0.22);font-family:NotoSansKR,sans-serif;';

      var title = document.createElement('div');
      title.textContent = m.name || '이름 없음';
      title.style.cssText =
        'font-size:13px;font-weight:700;color:#1A1A1A;margin-bottom:2px;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
      card.appendChild(title);

      if (m.subtitle) {
        var subtitle = document.createElement('div');
        subtitle.textContent = m.subtitle;
        subtitle.style.cssText = 'font-size:11px;color:#888;margin-bottom:8px;';
        card.appendChild(subtitle);
      }

      var detailBtn = document.createElement('div');
      detailBtn.textContent = '자세히 보기 ›';
      detailBtn.style.cssText = 'font-size:12px;font-weight:700;color:#2F8FE0;cursor:pointer;';
      detailBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        cocoHideCallout(divId);
        if (onMarkerClick) onMarkerClick(m.id);
      });
      card.appendChild(detailBtn);

      pop.appendChild(card);

      var caret = document.createElement('div');
      caret.style.cssText =
        'position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:0;height:0;' +
        'border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff;';
      pop.appendChild(caret);

      var closeBtn = document.createElement('div');
      closeBtn.textContent = '×';
      closeBtn.style.cssText =
        'position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;' +
        'background:rgba(0,0,0,0.4);color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer;';
      closeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        cocoHideCallout(divId);
      });
      pop.appendChild(closeBtn);

      var overlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(m.lat, m.lng),
        content: wrap,
        xAnchor: 0.5,
        yAnchor: 1,
        zIndex: 20,
        clickable: true,
      });
      overlay.setMap(map);
      window.__cocoKakaoCallout[divId] = overlay;
    }

    // 핀을 누르면 지도가 그 핀을 중심으로 부드럽게 이동(panTo)한 뒤 말풍선을 띄운다.
    // panTo가 끝나면 'idle' 이벤트가 한 번 더 발생해서 cocoRenderClusters가 다시
    // 돌며 열려있던 말풍선을 지워버리므로(마커 재계산 시 항상 먼저 닫음), 이동이
    // 끝난 뒤(=그 idle 이벤트 이후)에 말풍선을 띄워야 바로 사라지지 않는다.
    // 혹시 이미 그 핀이 중심이라 panTo가 아무 것도 안 움직여서 idle이 안 오는
    // 경우를 대비해 타임아웃 폴백도 같이 둔다.
    function cocoShowCalloutAfterPan(divId, map, m, onMarkerClick) {
      var shown = false;
      function showOnce() {
        if (shown) return;
        shown = true;
        kakao.maps.event.removeListener(map, 'idle', showOnce);
        cocoShowCallout(divId, map, m, onMarkerClick);
      }
      kakao.maps.event.addListener(map, 'idle', showOnce);
      setTimeout(showOnce, 400);
      map.panTo(new kakao.maps.LatLng(m.lat, m.lng));
    }

    // 핀이 몰릴 때(핀 천국) 화면 위에서 실제로 원(핀/클러스터 버블)끼리 겹칠 때만
    // 하나로 묶는다. 격자(grid)로 칸을 나누던 이전 방식은 칸 경계에 걸친 핀이 안
    // 묶이거나, 반대로 클러스터 버블 반지름이 칸 크기보다 커서 옆 칸 버블과 서로
    // 겹쳐 보이는(뭉친 원들이 지저분하게 겹쳐 보이는) 문제가 있었다. 대신 각 핀/
    // 클러스터를 화면 픽셀 원으로 보고, 겹치는 쌍이 하나도 없을 때까지 계속
    // 합치는 방식(계층적 병합)으로 바꿨다 — 그래서 작은 클러스터 두 개가 서로
    // 겹치면 그 클러스터끼리도 자동으로 더 큰 클러스터 하나로 다시 뭉친다.
    var COCO_SMALL_PIN_PX = 8; // 평범한 스팟 핀 지름 — 눈에 덜 띄게 아주 작게
    var COCO_BIG_PIN_PX = 20; // 로컬픽/인기 핀 지름
    var COCO_OVERLAP_SLACK_PX = 4; // 테두리(2~3px)까지 감안해 이 정도 겹치면 "겹친다"로 간주
    var COCO_CLUSTER_MIN_LEVEL = 4; // 카카오맵 레벨(작을수록 확대). 이 레벨보다 더 확대하면
    // 스팟이 많아도 클러스터링 자체를 끄고 낱개 핀을 그대로 보여준다 — 기본 줌(레벨 4)처럼
    // 밀집도가 높을 땐 큰 뭉치 버블이 계속 새로 생겨 지저분해 보이는 걸 막기 위함.

    function cocoPinRadiusPx(m) {
      var hasOrder = m.order !== null && m.order !== undefined;
      return (hasOrder || m.trending || m.isLocalPick ? COCO_BIG_PIN_PX : COCO_SMALL_PIN_PX) / 2;
    }

    function cocoClusterSizePx(count) {
      return Math.min(34 + count * 4, 64); // 개수가 많을수록 커지되 상한을 둠
    }

    function cocoRenderClusters(divId) {
      var map = window.__cocoKakaoMaps[divId];
      var raw = window.__cocoKakaoMarkersRaw[divId] || [];
      if (!map) return;

      // 말풍선(CustomOverlay)은 자기 lat/lng 좌표를 직접 들고 있어서 마커 배열이
      // 다시 그려져도 위치가 깨지지 않는다 — 그래서 여기서 자동으로 닫지 않는다.
      // (예전엔 매번 닫았는데, 핀 탭 시 panTo로 지도가 살짝 움직이면 뷰포트 재조회 →
      // 마커 재계산이 뒤따라 일어나서 말풍선이 뜨자마자 바로 닫혀버리는 버그가 있었음.
      // 닫기는 "×" 버튼과 지도 빈 곳 탭 핸들러가 이미 처리하므로 이걸로 충분하다.)

      (window.__cocoKakaoMarkers[divId] || []).forEach(function (m) { m.setMap(null); });
      (window.__cocoKakaoOverlays[divId] || []).forEach(function (o) { o.setMap(null); });

      var projection = map.getProjection();
      var onMarkerClick = window.__cocoMarkerClickHandlers[divId];

      function project(lat, lng) {
        return projection.pointFromCoords(new kakao.maps.LatLng(lat, lng));
      }

      // 마커 하나당 노드 하나로 시작 — 반지름은 그 핀 자신의 시각적 반지름.
      var nodes = raw.map(function (m) {
        var p = project(m.lat, m.lng);
        return { lat: m.lat, lng: m.lng, x: p.x, y: p.y, members: [m] };
      });

      function radiusOf(node) {
        return node.members.length === 1 ? cocoPinRadiusPx(node.members[0]) : cocoClusterSizePx(node.members.length) / 2;
      }

      // 겹치는 쌍이 하나도 안 남을 때까지 반복해서 합친다. 합칠 때마다 중심(위경도
      // 평균)과 반지름(멤버 수 기준)을 다시 계산하므로, 합쳐져서 커진 원이 세 번째
      // 원과 또 겹치면 다음 반복에서 그것도 같이 합쳐진다.
      // 예전엔 병합이 하나 생길 때마다 while 루프 전체를 처음부터(i=0) 다시
      // 돌았다 — 스팟 수가 늘어나면(예: 좁은 구역→넓은 구역 전환) 병합 횟수만큼
      // 전체 재스캔이 반복되어 수 초까지 걸리는 원인이었다. i는 그대로 두고 같은
      // 자리(j)부터 이어서 비교하도록 바꿔서, 한 바퀴(while 1회)에 i 하나가 겹칠
      // 수 있는 걸 다 합치고 넘어가게 했다 — 결과(겹치면 합친다)는 동일하고 속도만 개선.
      // 코스 순서 핀(order)처럼 개수가 적고 각 핀 번호가 꼭 보여야 하는 경우엔
      // __cocoClusteringDisabled로 이 병합 자체를 건너뛴다.
      var clusteringDisabled = !!window.__cocoClusteringDisabled[divId] || map.getLevel() <= COCO_CLUSTER_MIN_LEVEL;
      var mergedAny = !clusteringDisabled;
      while (mergedAny) {
        mergedAny = false;
        for (var i = 0; i < nodes.length; i++) {
          for (var j = i + 1; j < nodes.length; j++) {
            var a = nodes[i], b = nodes[j];
            var dx = a.x - b.x, dy = a.y - b.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < radiusOf(a) + radiusOf(b) + COCO_OVERLAP_SLACK_PX) {
              var members = a.members.concat(b.members);
              var lat = members.reduce(function (s, m) { return s + m.lat; }, 0) / members.length;
              var lng = members.reduce(function (s, m) { return s + m.lng; }, 0) / members.length;
              var p = project(lat, lng);
              nodes.splice(j, 1);
              nodes[i] = { lat: lat, lng: lng, x: p.x, y: p.y, members: members };
              mergedAny = true;
              j--; // b가 없어졌으니 같은 인덱스(j)에 온 다음 노드와 계속 비교
            }
          }
        }
      }

      var newMarkers = [];
      var newOverlays = [];

      // 코스 순서 핀(order)은 클러스터링이 꺼져 있어서(위 clusteringDisabled) 아무리
      // 다닥다닥 붙어 있어도 뭉쳐지지 않는다 — 번호가 항상 낱개로 보여야 하기 때문.
      // 개별 핀 밀집도가 아니라 지도 줌 레벨에 맞춰 전부 같은 배율로 통일한다 —
      // 기본(넓게 보기)에선 겹침 방지용으로 작게, 사용자가 확대할수록 핀 사이
      // 간격이 넓어지니 원래 크기까지 점점 커지게(bounds_changed가 줌마다
      // cocoRenderClusters를 다시 불러주므로 여기만 레벨을 읽으면 됨).
      var COCO_ORDER_PIN_MIN_SCALE = 0.6;
      var COCO_ORDER_PIN_MAX_SCALE = 1.2; // 확대했을 때 원래 크기보다 더 커 보이게(공격적으로) 상한을 올림
      var COCO_ORDER_PIN_MAX_LEVEL = 5; // 이 레벨(넓게 보기)보다 더 축소하면 항상 최소 크기
      var COCO_ORDER_PIN_MIN_LEVEL = 3; // 예전엔 레벨 2에서 최대였는데, 한 단계만 확대해도
      // 빨리 커지도록(공격적으로) 범위를 3levels→2levels로 좁힘
      var orderPinZoomT = (COCO_ORDER_PIN_MAX_LEVEL - map.getLevel()) / (COCO_ORDER_PIN_MAX_LEVEL - COCO_ORDER_PIN_MIN_LEVEL);
      orderPinZoomT = Math.max(0, Math.min(1, orderPinZoomT));
      var COCO_ORDER_PIN_SCALE = COCO_ORDER_PIN_MIN_SCALE + (COCO_ORDER_PIN_MAX_SCALE - COCO_ORDER_PIN_MIN_SCALE) * orderPinZoomT;

      nodes.forEach(function (node) {
        if (node.members.length === 1) {
          var hasOrder = node.members[0].order !== null && node.members[0].order !== undefined;
          renderSinglePin(node.members[0], hasOrder ? COCO_ORDER_PIN_SCALE : 1);
        } else {
          renderClusterBubble(node.members);
        }
      });

      function renderSinglePin(m, shrinkScale) {
        var position = new kakao.maps.LatLng(m.lat, m.lng);
        // 코스("지도에서 보기")로 들어온 스팟은 순서 번호(order)가 있다 — 이 경우
        // 로컬 픽(2단계)과 동일한 크기/색으로 통일하고, 안에 그 번호를 적는다.
        var hasOrder = m.order !== null && m.order !== undefined;
        // 로컬 픽이거나 인기(trending)이면 큰 점, 둘 다 아니면 작은 점.
        // 색은 로컬 픽/코스 순서 핀일 때만 강조색(주황) — trending만 있는 건
        // "큰 점"(색은 기본), 아무것도 없으면 "작은 점".
        var isBig = hasOrder || m.trending || m.isLocalPick;
        var scale = shrinkScale || 1;
        var size = (isBig ? COCO_BIG_PIN_PX : COCO_SMALL_PIN_PX) * scale;
        var borderWidth = (isBig ? 3 : 2) * scale; // 점이 워낙 작아져서 두꺼운 테두리는 비율이 안 맞음
        var color = (hasOrder || m.isLocalPick) ? '#FF7A33' : '#2F8FE0';
        var pin = document.createElement('div');
        pin.style.cssText =
          'width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + color + ';' +
          'border:' + borderWidth + 'px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);cursor:pointer;' +
          (hasOrder
            ? 'display:flex;align-items:center;justify-content:center;color:#fff;' +
              'font-family:NotoSansKR,sans-serif;font-weight:800;font-size:' + (11 * scale) + 'px;line-height:1;'
            : '');
        if (hasOrder) pin.textContent = String(m.order);
        // 바로 이동하지 않고, 지도를 이 핀 중심으로 부드럽게 옮긴 뒤 이름/카테고리
        // 말풍선을 띄운다 — "자세히 보기"를 한 번 더 눌러야 실제 onMarkerClick(상세
        // 화면 이동)이 호출된다.
        pin.addEventListener('click', function (e) {
          e.stopPropagation();
          cocoShowCalloutAfterPan(divId, map, m, onMarkerClick);
        });
        var pinOverlay = new kakao.maps.CustomOverlay({
          position: position, content: pin, xAnchor: 0.5, yAnchor: 0.5, clickable: true, zIndex: 1,
        });
        pinOverlay.setMap(map);
        newMarkers.push(pinOverlay);

        // 이름 태그는 로컬 픽/인기 핀처럼 눈에 띄어야 하는 것만 보여준다 — 평범한 스팟까지
        // 다 이름표를 달면 지도가 너무 복잡해 보여서, 작은 점은 이름 없이 점만 찍는다.
        if (m.name && isBig) {
          var tag = document.createElement('div');
          tag.textContent = m.name;
          tag.style.cssText =
            'background:#fff;border-radius:12px;padding:' + (3 * scale) + 'px ' + (10 * scale) + 'px;' +
            'font-family:NotoSansKR,sans-serif;font-size:' + (12 * scale) + 'px;font-weight:700;color:#1A1A1A;' +
            'box-shadow:0 1px 4px rgba(0,0,0,0.25);white-space:nowrap;cursor:pointer;';
          tag.addEventListener('click', function (e) {
            e.stopPropagation();
            cocoShowCalloutAfterPan(divId, map, m, onMarkerClick);
          });
          // 이름표는 다른 핀이 뒤늦게 그려져도 항상 그 핀보다 위에 보이도록 zIndex를
          // 핀(1)보다 높게 줘서, 겹쳤을 때 이름표가 가려지지 않고 앞으로 오게 한다.
          var overlay = new kakao.maps.CustomOverlay({
            position: position, content: tag, yAnchor: 1.9, clickable: true, zIndex: 3,
          });
          overlay.setMap(map);
          newOverlays.push(overlay);
        }
      }

      function renderClusterBubble(group) {
        var avgLat = group.reduce(function (s, m) { return s + m.lat; }, 0) / group.length;
        var avgLng = group.reduce(function (s, m) { return s + m.lng; }, 0) / group.length;
        var position = new kakao.maps.LatLng(avgLat, avgLng);

        var size = cocoClusterSizePx(group.length);
        // 커질수록 아래 지도가 살짝 비쳐 보이도록 더 반투명하게 — 뭉친 핀 느낌을 줄인다.
        var alpha = Math.max(0.45, 0.75 - group.length * 0.03);
        var bubble = document.createElement('div');
        bubble.style.cssText =
          'width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
          'background:rgba(27,95,168,' + alpha + ');border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.35);' +
          'display:flex;align-items:center;justify-content:center;cursor:pointer;' +
          'color:#fff;font-family:NotoSansKR,sans-serif;font-weight:800;font-size:13px;';
        bubble.textContent = String(group.length);
        bubble.addEventListener('click', function () {
          // 클러스터를 탭하면 그 위치로 확대 — 낱개 핀이 보일 때까지 계속 눌러 들어갈 수 있다.
          map.setLevel(Math.max(map.getLevel() - 2, 1), { anchor: position });
          map.setCenter(position);
        });
        var bubbleOverlay = new kakao.maps.CustomOverlay({
          position: position, content: bubble, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5, clickable: true,
        });
        bubbleOverlay.setMap(map);
        newMarkers.push(bubbleOverlay);
      }

      window.__cocoKakaoMarkers[divId] = newMarkers;
      window.__cocoKakaoOverlays[divId] = newOverlays;

      // 코스 순서 핀(order)이 있으면 번호 순서대로 선으로 이어준다 — 일반 지도
      // 탐색에서는 order가 없는 마커뿐이라 아무 선도 그려지지 않는다.
      var existingPolyline = window.__cocoKakaoPolyline[divId];
      if (existingPolyline) {
        existingPolyline.setMap(null);
        window.__cocoKakaoPolyline[divId] = null;
      }
      var orderedRaw = raw
        .filter(function (m) { return m.order !== null && m.order !== undefined; })
        .sort(function (a, b) { return a.order - b.order; });
      if (orderedRaw.length >= 2) {
        var path = orderedRaw.map(function (m) { return new kakao.maps.LatLng(m.lat, m.lng); });
        var polyline = new kakao.maps.Polyline({
          path: path,
          strokeWeight: 3,
          strokeColor: '#FF7A33',
          strokeOpacity: 0.85,
          strokeStyle: 'shortdash',
        });
        polyline.setMap(map);
        window.__cocoKakaoPolyline[divId] = polyline;
      }
    }

    window.cocoLoadKakaoSdk = function (appKey) {
      if (window.__cocoKakaoLoadPromise) return window.__cocoKakaoLoadPromise;
      window.__cocoKakaoLoadPromise = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + appKey + '&autoload=false';
        script.onload = function () {
          kakao.maps.load(function () { resolve(); });
        };
        script.onerror = function () { reject(new Error('카카오맵 SDK 로드 실패')); };
        document.head.appendChild(script);
      });
      return window.__cocoKakaoLoadPromise;
    };

    window.cocoInitKakaoMap = function (divId, lat, lng, level) {
      var container = document.getElementById(divId);
      var map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(lat, lng),
        level: level,
      });
      window.__cocoKakaoMaps[divId] = map;
      window.__cocoKakaoMarkers[divId] = [];
      window.__cocoKakaoOverlays[divId] = [];
      window.__cocoKakaoMarkersRaw[divId] = [];
      window.__cocoKakaoPolyline[divId] = null;

      // 지도 빈 곳을 탭하면 열려있던 핀 정보 말풍선을 닫는다.
      kakao.maps.event.addListener(map, 'click', function () {
        cocoHideCallout(divId);
      });

      // 원래는 'idle'(드래그/줌이 완전히 멈췄을 때 한 번) 이벤트로 처리했는데,
      // 트랙패드로 휠 줌을 하면 손을 뗀 뒤에도 관성(모멘텀) 휠 이벤트가 한동안 계속
      // 들어와서 카카오맵이 "아직 움직이는 중"이라 판단해 idle이 안 오고, 커서가
      // 지도 영역을 벗어나야(=그 순간 모멘텀 이벤트 전달이 끊겨야) 뒤늦게 idle이
      // 발생하는 문제가 있었다. 'bounds_changed'는 이동/줌 도중에도 계속 자주
      // 발생하므로, idle을 기다리는 대신 이 이벤트를 우리가 직접 디바운스해서
      // "마지막 변경 후 일정 시간 조용하면" 갱신하도록 바꿨다 — 커서 위치와 무관하게 동작.
      kakao.maps.event.addListener(map, 'bounds_changed', function () {
        clearTimeout(window.__cocoBoundsDebounceTimers[divId]);
        window.__cocoBoundsDebounceTimers[divId] = setTimeout(function () {
          cocoRenderClusters(divId);
          var onBoundsChanged = window.__cocoBoundsChangedHandlers[divId];
          if (onBoundsChanged) {
            var bounds = map.getBounds();
            var sw = bounds.getSouthWest();
            var ne = bounds.getNorthEast();
            onBoundsChanged(sw.getLat(), sw.getLng(), ne.getLat(), ne.getLng());
          }
        }, 400);
      });
    };

    window.cocoSetKakaoMarkers = function (divId, markersJson, onMarkerClick) {
      var map = window.__cocoKakaoMaps[divId];
      if (!map) return;
      window.__cocoKakaoMarkersRaw[divId] = JSON.parse(markersJson);
      window.__cocoMarkerClickHandlers[divId] = onMarkerClick;
      cocoRenderClusters(divId);
    };

    // 코스 순서 핀처럼 개수가 적고 겹쳐도 절대 뭉쳐 보이면 안 되는 지도에서 끈다.
    window.cocoSetClusteringEnabled = function (divId, enabled) {
      window.__cocoClusteringDisabled[divId] = !enabled;
      if (window.__cocoKakaoMaps[divId]) cocoRenderClusters(divId);
    };

    // 지도 화면(뷰포트)이 바뀔 때마다 그 범위를 Dart로 알려준다 — 화면에 보이는
    // 영역만큼만 서버에 다시 요청해서 표시하고 싶을 때(핀 밀집 방지) 사용.
    window.cocoSetBoundsChangedHandler = function (divId, onBoundsChanged) {
      window.__cocoBoundsChangedHandlers[divId] = onBoundsChanged;
    };

    window.cocoSetKakaoCenter = function (divId, lat, lng) {
      var map = window.__cocoKakaoMaps[divId];
      if (map) map.setCenter(new kakao.maps.LatLng(lat, lng));
    };

    // 코스에서 "지도에서 보기"처럼, 여러 스팟이 한 화면에 다 들어오게 맞출 때 쓴다.
    // 점이 하나뿐이면 bounds로는 과하게 확대되므로 그냥 중심 이동만 한다.
    window.cocoFitKakaoBounds = function (divId, pointsJson) {
      var map = window.__cocoKakaoMaps[divId];
      if (!map) return;
      var points = JSON.parse(pointsJson);
      if (!points.length) return;
      if (points.length === 1) {
        map.setCenter(new kakao.maps.LatLng(points[0].lat, points[0].lng));
        return;
      }
      var bounds = new kakao.maps.LatLngBounds();
      points.forEach(function (p) {
        bounds.extend(new kakao.maps.LatLng(p.lat, p.lng));
      });
      map.setBounds(bounds);
    };

    // 검색 결과 탭 전용 — 단순 재중심(cocoSetKakaoCenter)과 달리 살짝 확대까지
    // 하고, 이동이 끝나면 핀을 직접 탭했을 때와 똑같은 말풍선(뿅 애니메이션 포함)을
    // 띄운다. 확대는 애니메이션 없이 즉시 적용하고, 이동은 기존 panTo 애니메이션을
    // 그대로 재사용(cocoShowCalloutAfterPan)한다.
    var COCO_SEARCH_FOCUS_LEVEL = 3;

    window.cocoFocusSpot = function (divId, markerJson) {
      var map = window.__cocoKakaoMaps[divId];
      if (!map) return;
      var m = JSON.parse(markerJson);
      var onMarkerClick = window.__cocoMarkerClickHandlers[divId];
      map.setLevel(COCO_SEARCH_FOCUS_LEVEL);
      cocoShowCalloutAfterPan(divId, map, m, onMarkerClick);
    };

    // 지도를 직접 눌러서 좌표를 찍는 용도(스팟 등록 화면의 "지도를 눌러 위치를
    // 직접 찍을 수 있어요" 기능). divId당 한 번만 리스너를 붙인다.
    window.__cocoMapClickHandlers = {};

    window.cocoSetMapClickHandler = function (divId, onClick) {
      var map = window.__cocoKakaoMaps[divId];
      if (!map || window.__cocoMapClickHandlers[divId]) return;
      var listener = function (mouseEvent) {
        onClick(mouseEvent.latLng.getLat(), mouseEvent.latLng.getLng());
      };
      kakao.maps.event.addListener(map, 'click', listener);
      window.__cocoMapClickHandlers[divId] = listener;
    };

    // 내 위치(GPS) 표시 — 스팟 핀(밝은 블루 단색 원)과 헷갈리지 않도록
    // 진한 남색 점 + 정확도 원 + 나침반 연동 방향 부채꼴로 구성한다.
    // divId당 오버레이 하나만 유지하고, 위치가 바뀌면 새로 만들지 않고 위치만 갱신한다.
    window.__cocoKakaoMyLocationOverlay = {};
    window.__cocoKakaoMyLocationCone = {}; // divId -> 방향 부채꼴 DOM (나침반 값으로 회전)
    window.__cocoHeadingWatchers = {}; // divId -> 리스너 해제 함수 (중복 등록 방지)

    window.cocoSetMyLocation = function (divId, lat, lng) {
      var map = window.__cocoKakaoMaps[divId];
      if (!map) return;
      var position = new kakao.maps.LatLng(lat, lng);
      var existing = window.__cocoKakaoMyLocationOverlay[divId];
      if (existing) {
        existing.setPosition(position);
        return;
      }

      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;width:60px;height:60px;pointer-events:none;';

      // 정확도 표시 원 (옅은 파랑)
      var halo = document.createElement('div');
      halo.style.cssText =
        'position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;' +
        'border-radius:50%;background:rgba(47,143,224,0.15);';
      wrap.appendChild(halo);

      // 방향 부채꼴 — 나침반(deviceorientation) heading 값으로 회전시켜 "보는 방향"을 표시.
      // 스팟 핀에는 없는, 내 위치 마커 전용 요소라 시각적으로도 명확히 구분된다.
      // translate(-50%,-100%)로 부채꼴 자신의 크기 기준으로 중심을 맞춘 뒤 같은 transform
      // 안에서 회전시켜야, margin 계산 오차 없이 항상 점(dot) 중심을 정확히 축으로 회전한다.
      var cone = document.createElement('div');
      cone.style.cssText =
        'position:absolute;top:50%;left:50%;width:0;height:0;' +
        'border-left:7px solid transparent;border-right:7px solid transparent;' +
        'border-bottom:22px solid rgba(27,95,168,0.45);' +
        'transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);' +
        'transition:transform 0.15s linear;';
      wrap.appendChild(cone);
      window.__cocoKakaoMyLocationCone[divId] = cone;

      // 중심 점 — 스팟 핀(#2F8FE0)과 구분되는 진한 남색 + 흰 테두리
      var dot = document.createElement('div');
      dot.style.cssText =
        'position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;' +
        'border-radius:50%;background:#1B5FA8;border:3px solid #fff;' +
        'box-shadow:0 0 0 1px rgba(27,95,168,0.5),0 1px 4px rgba(0,0,0,0.35);z-index:2;';
      wrap.appendChild(dot);

      var overlay = new kakao.maps.CustomOverlay({
        position: position,
        content: wrap,
        xAnchor: 0.5,
        yAnchor: 0.5,
        zIndex: 10,
      });
      overlay.setMap(map);
      window.__cocoKakaoMyLocationOverlay[divId] = overlay;

      window.cocoStartHeadingWatch(divId);
    };

    window.cocoSetMyHeading = function (divId, heading) {
      var cone = window.__cocoKakaoMyLocationCone[divId];
      if (!cone || typeof heading !== 'number' || isNaN(heading)) return;
      // translate로 중심을 맞춘 뒤 그 상태에서 회전해야 하므로, 두 transform을 함께 적용한다.
      cone.style.transform = 'translate(-50%,-100%) rotate(' + heading + 'deg)';
    };

    // 기기 나침반(지자기 센서) 연동 — 브라우저/기기별로 지원 여부와 정확도가 갈리는
    // 베스트 에포트 기능이다. 실패해도 조용히 무시한다(방향 부채꼴이 고정된 채로 남을 뿐,
    // 위치 점 표시 자체는 정상 동작).
    window.cocoStartHeadingWatch = function (divId) {
      if (window.__cocoHeadingWatchers[divId]) return; // 이미 등록됨

      function handleOrientation(event) {
        var heading = null;
        if (typeof event.webkitCompassHeading === 'number') {
          // iOS Safari — 이미 화면 기준 나침반 방향(0~360)을 제공.
          heading = event.webkitCompassHeading;
        } else if (event.absolute && typeof event.alpha === 'number') {
          // Android Chrome(deviceorientationabsolute) — alpha는 반시계 기준이라 보정.
          heading = (360 - event.alpha) % 360;
        }
        if (heading !== null) {
          window.cocoSetMyHeading(divId, heading);
        }
      }

      function attach() {
        if (window.__cocoHeadingWatchers[divId]) return;
        var useAbsolute = 'ondeviceorientationabsolute' in window;
        var eventName = useAbsolute ? 'deviceorientationabsolute' : 'deviceorientation';
        window.addEventListener(eventName, handleOrientation);
        window.__cocoHeadingWatchers[divId] = function () {
          window.removeEventListener(eventName, handleOrientation);
        };
      }

      // iOS 13+는 사용자 제스처 컨텍스트 안에서 명시적 권한 요청이 필요하다.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(function (state) {
          if (state === 'granted') attach();
        }).catch(function () {
          // 권한 거부/실패 — 방향 표시 없이 위치 점만 보여준다.
        });
      } else {
        attach();
      }
    };

    window.cocoStopHeadingWatch = function (divId) {
      var detach = window.__cocoHeadingWatchers[divId];
      if (detach) {
        detach();
        delete window.__cocoHeadingWatchers[divId];
      }
    };
  </script>
</body>
</html>
